<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro - JOTAPÊ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Bibliotecas do Banco de Dados Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans p-2 md:p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <header class="bg-slate-900 text-white p-6 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold"><i class="fas fa-chart-pie text-blue-400 mr-3"></i>Meu Controle Financeiro - JOTAPÊ</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="mostrarAba('despesas')" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500 transition">Controle Pessoal</button>
                <button onclick="mostrarAba('fiis')" class="bg-indigo-600 px-4 py-2 rounded font-bold hover:bg-indigo-500 transition">Carteira FIIs</button>
            </div>
        </header>

        <!-- ABA 1: CONTROLE PESSOAL -->
        <section id="aba-despesas" class="bg-white p-6 rounded-xl shadow-md mb-6 block">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4"><i class="fas fa-wallet text-blue-600 mr-2"></i>Registro de Custos</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
                <select id="categoria" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="Água Casa">Água Casa</option>
                    <option value="Energia Casa">Energia Casa</option>
                    <option value="Internet Casa">Internet Casa</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Aluguel Casa/AP">Aluguel Casa/AP</option>
                    <option value="UBER">UBER</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outros">Outros (Nova Categoria)</option>
                </select>
                <input type="text" id="descricao" placeholder="Descrição (Opcional)" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                <input type="number" id="valor" placeholder="Valor (R$)" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="salvarDespesa()" class="bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 transition">Salvar Despesa</button>
            </div>

            <!-- Espaço de Análise IA -->
            <div class="bg-slate-900 text-white p-5 rounded-xl shadow-inner mt-6">
                <h3 class="font-bold text-lg mb-2"><i class="fas fa-brain text-purple-400 mr-2"></i>Análise Inteligente de Caixa</h3>
                <p class="text-sm text-slate-300 mb-4">Verificando balanço de receitas e despesas para gerar orientações automáticas de melhoria do orçamento familiar.</p>
                <button onclick="alert('Configuraremos a chave do Gemini em breve para gerar relatórios detalhados!')" class="bg-purple-600 px-4 py-2 rounded text-sm font-bold hover:bg-purple-500 transition">Gerar Análise Profunda</button>
            </div>
        </section>

        <!-- ABA 2: CARTEIRA FIIS -->
        <section id="aba-fiis" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex flex-col md:flex-row justify-between items-center border-b pb-3 mb-4 gap-4">
                <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-city text-indigo-600 mr-2"></i>Meus Fundos Imobiliários</h2>
                <button onclick="atualizarDadosB3()" class="bg-emerald-600 text-white px-4 py-2 rounded font-bold hover:bg-emerald-500 transition shadow">
                    <i class="fas fa-sync-alt mr-2"></i>Buscar Cotações e Dividendos na Web
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
                <input type="text" id="ticker" placeholder="Ativo (Ex: MXRF11)" class="border p-2 rounded uppercase focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input type="number" id="qtd" placeholder="Quantidade" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input type="number" id="preco" placeholder="Preço Pago (R$)" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <button onclick="alert('Ativo registrado! O sistema organizará sua carteira.')" class="bg-indigo-600 text-white font-bold p-2 rounded hover:bg-indigo-700 transition">Adicionar à Carteira</button>
            </div>
        </section>
    </div>

    <script>
        // Navegação das abas
        function mostrarAba(aba) {
            document.getElementById('aba-despesas').classList.add('hidden');
            document.getElementById('aba-fiis').classList.add('hidden');
            document.getElementById('aba-' + aba).classList.remove('hidden');
            document.getElementById('aba-' + aba).classList.add('block');
        }

        function atualizarDadosB3() {
            alert("Buscando dados em tempo real... Logo conectaremos a API Financeira para puxar a cotação e a data exata do último dividendo pago!");
        }

const firebaseConfig = {
  apiKey: "AIzaSyCJINhQlfEvFGzxmCeQnVhbMBvK_APozQM",
  authDomain: "meu-controle-financeiro-5e4d3.firebaseapp.com",
  projectId: "meu-controle-financeiro-5e4d3",
  storageBucket: "meu-controle-financeiro-5e4d3.firebasestorage.app",
  messagingSenderId: "198921382366",
  appId: "1:198921382366:web:f28462ed60e5e98637554f"
};

        const firebaseConfig = {
            apiKey: "COLE_AQUI",
            authDomain: "COLE_AQUI",
            projectId: "COLE_AQUI",
            storageBucket: "COLE_AQUI",
            messagingSenderId: "COLE_AQUI",
            appId: "COLE_AQUI"
        };
        // ==========================================

        // Inicializando o Banco de Dados
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function salvarDespesa() {
            const cat = document.getElementById('categoria').value;
            const desc = document.getElementById('descricao').value;
            const val = document.getElementById('valor').value;
            
            if(!val) return alert('Preencha o valor!');

            db.collection("despesas_jotape").add({
                categoria: cat,
                descricao: desc,
                valor: parseFloat(val),
                data: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Salvo com sucesso na nuvem!");
                document.getElementById('descricao').value = '';
                document.getElementById('valor').value = '';
            });
        }
    </script>
</body>
</html>
