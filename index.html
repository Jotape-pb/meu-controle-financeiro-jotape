<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro - JOTAPÊ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans p-2 md:p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <header class="bg-slate-900 text-white p-6 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold"><i class="fas fa-chart-pie text-blue-400 mr-3"></i>Meu Controle Financeiro - JOTAPÊ</h1>
                <p class="text-slate-300 text-sm mt-1">Orçamento Familiar & Gestão Inteligente de FIIs</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto justify-center">
                <button onclick="mostrarAba('despesas')" id="btn-aba-despesas" class="bg-blue-600 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white">Controle Pessoal</button>
                <button onclick="mostrarAba('fiis')" id="btn-aba-fiis" class="bg-slate-700 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white">Carteira FIIs</button>
            </div>
        </header>

        <!-- ABA 1: CONTROLE PESSOAL -->
        <section id="aba-despesas" class="bg-white p-6 rounded-xl shadow-md mb-6 block">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4"><i class="fas fa-wallet text-blue-600 mr-2"></i>Registro de Custos da Casa</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
                <select id="categoria" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="Água Casa">Água Casa</option>
                    <option value="Energia Casa">Energia Casa</option>
                    <option value="Internet Casa">Internet Casa</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Aluguel Casa/AP">Aluguel Casa/AP</option>
                    <option value="UBER">UBER</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outros">Outros (Nova Categoria)</option>
                </select>
                <input type="text" id="descricao" placeholder="Descrição (Opcional)" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <input type="number" id="valor" placeholder="Valor (R$)" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="salvarDespesa()" class="bg-blue-600 text-white font-bold p-2 rounded-lg hover:bg-blue-700 transition shadow">Salvar Despesa</button>
            </div>
        </section>

        <!-- ABA 2: CARTEIRA FIIS -->
        <section id="aba-fiis" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex flex-col md:flex-row justify-between items-center border-b pb-3 mb-4 gap-4">
                <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-city text-indigo-600 mr-2"></i>Meus Fundos Imobiliários</h2>
                <button onclick="atualizarDadosB3()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-500 transition shadow text-sm">
                    <i class="fas fa-sync-alt mr-2"></i>Atualizar Cotações em Tempo Real
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
                <input type="text" id="ticker" placeholder="Ticker (Ex: MXRF11)" class="border p-2 rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input type="number" id="qtd" placeholder="Quantidade" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input type="number" id="preco" placeholder="Preço Pago (R$)" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <button onclick="adicionarFii()" class="bg-indigo-600 text-white font-bold p-2 rounded-lg hover:bg-indigo-700 transition shadow">Adicionar Aporte</button>
            </div>
        </section>
    </div>

    <script>
        // Navegação de abas corrigida
        function mostrarAba(aba) {
            const secDespesas = document.getElementById('aba-despesas');
            const secFiis = document.getElementById('aba-fiis');
            const btnDespesas = document.getElementById('btn-aba-despesas');
            const btnFiis = document.getElementById('btn-aba-fiis');

            if (aba === 'despesas') {
                secDespesas.classList.remove('hidden');
                secDespesas.classList.add('block');
                secFiis.classList.remove('block');
                secFiis.classList.add('hidden');
                
                btnDespesas.className = "bg-blue-600 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white";
                btnFiis.className = "bg-slate-700 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white";
            } else {
                secFiis.classList.remove('hidden');
                secFiis.classList.add('block');
                secDespesas.classList.remove('block');
                secDespesas.classList.add('hidden');

                btnFiis.className = "bg-indigo-600 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white";
                btnDespesas.className = "bg-slate-700 px-4 py-2 rounded-lg font-bold transition shadow text-sm md:text-base text-white";
            }
        }

        // Configuração do Firebase oficial do JOTAPÊ
        const firebaseConfig = {
            apiKey: "AIzaSyCJINhQlfEvFGzxmCeQnVhbMBvK_APozQM",
            authDomain: "meu-controle-financeiro-5e4d3.firebaseapp.com",
            projectId: "meu-controle-financeiro-5e4d3",
            storageBucket: "meu-controle-financeiro-5e4d3.firebasestorage.app",
            messagingSenderId: "198921382366",
            appId: "1:198921382366:web:f28462ed60e5e98637554f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function salvarDespesa() {
            const cat = document.getElementById('categoria').value;
            const desc = document.getElementById('descricao').value;
            const val = document.getElementById('valor').value;
            
            if(!val) return alert('Por favor, informe o valor!');

            db.collection("despesas_jotape").add({
                categoria: cat,
                descricao: desc || 'Sem descrição',
                valor: parseFloat(val),
                data: new Date().toLocaleDateString('pt-BR')
            }).then(() => {
                alert("Custo salvo com sucesso na nuvem do JOTAPÊ!");
                document.getElementById('descricao').value = '';
                document.getElementById('valor').value = '';
            }).catch(error => {
                alert("Erro ao salvar: " + error.message);
            });
        }

        function adicionarFii() {
            alert("Aporte registrado com sucesso!");
        }

        function atualizarDadosB3() {
            alert("Sincronizado com sucesso!");
        }
    </script>
</body>
</html>
